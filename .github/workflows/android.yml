name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rules test dependencies
        working-directory: rules-test
        run: npm ci || npm install
      - name: Run Firestore rules tests on the emulator
        working-directory: rules-test
        run: npx firebase emulators:exec --project demo-engqa --only firestore --config ../firebase.json "npm test"
